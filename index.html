<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteor Dodge</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }

    .game-wrap {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    #game {
      width: 100%;
      background: #050814;
      border: 2px solid #334;
      border-radius: 12px;
      display: block;
    }

    .info {
      margin: 12px 0;
      font-size: 18px;
    }

    button {
      padding: 12px 22px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #startBtn {
      background: #5b7cff;
      color: white;
    }

    .controls button {
      background: #222b45;
      color: white;
      min-width: 120px;
    }
  </style>
</head>

<body>
  <div class="game-wrap">
    <h1>Meteor Dodge</h1>
    <p>Dodge the meteors and collect stars.</p>

    <div class="info">
      Score: <span id="score">0</span>
      |
      Best: <span id="best">0</span>
    </div>

    <canvas id="game" width="700" height="400"></canvas>

    <button id="startBtn">Start Game</button>

    <div class="controls">
      <button id="leftBtn">← Left</button>
      <button id="rightBtn">Right →</button>
    </div>

    <p>Keyboard: Left Arrow / Right Arrow</p>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const bestText = document.getElementById("best");
    const startBtn = document.getElementById("startBtn");

    const player = {
      x: 330,
      y: 340,
      width: 40,
      height: 35,
      speed: 7
    };

    let meteors = [];
    let stars = [];

    let score = 0;
    let best = 0;
    let running = false;

    let leftPressed = false;
    let rightPressed = false;

    function drawPlayer() {
      ctx.fillStyle = "#6c8cff";

      ctx.beginPath();
      ctx.moveTo(
        player.x + player.width / 2,
        player.y
      );

      ctx.lineTo(
        player.x + player.width,
        player.y + player.height
      );

      ctx.lineTo(
        player.x,
        player.y + player.height
      );

      ctx.closePath();
      ctx.fill();
    }

    function createMeteor() {
      const size = 15 + Math.random() * 20;

      meteors.push({
        x: Math.random() * (canvas.width - size),
        y: -40,
        size: size,
        speed: 3 + Math.random() * 4
      });
    }

    function createStar() {
      stars.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        size: 12,
        speed: 3
      });
    }

    function drawMeteor(meteor) {
      ctx.fillStyle = "#a36f4f";

      ctx.beginPath();
      ctx.arc(
        meteor.x,
        meteor.y,
        meteor.size,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    function drawStar(star) {
      ctx.font = "25px Arial";
      ctx.textAlign = "center";
      ctx.fillText("⭐", star.x, star.y);
    }

    function collisionCircleRectangle(circle, rect) {
      const closestX = Math.max(
        rect.x,
        Math.min(circle.x, rect.x + rect.width)
      );

      const closestY = Math.max(
        rect.y,
        Math.min(circle.y, rect.y + rect.height)
      );

      const dx = circle.x - closestX;
      const dy = circle.y - closestY;

      return (
        dx * dx + dy * dy <
        circle.size * circle.size
      );
    }

    function update() {
      if (!running) return;

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      if (leftPressed) {
        player.x -= player.speed;
      }

      if (rightPressed) {
        player.x += player.speed;
      }

      if (player.x < 0) {
        player.x = 0;
      }

      if (
        player.x + player.width >
        canvas.width
      ) {
        player.x =
          canvas.width - player.width;
      }

      drawPlayer();

      for (
        let i = meteors.length - 1;
        i >= 0;
        i--
      ) {
        const meteor = meteors[i];

        meteor.y += meteor.speed;

        drawMeteor(meteor);

        if (
          collisionCircleRectangle(
            meteor,
            player
          )
        ) {
          gameOver();
          return;
        }

        if (
          meteor.y >
          canvas.height + 50
        ) {
          meteors.splice(i, 1);
        }
      }

      for (
        let i = stars.length - 1;
        i >= 0;
        i--
      ) {
        const star = stars[i];

        star.y += star.speed;

        drawStar(star);

        if (
          collisionCircleRectangle(
            star,
            player
          )
        ) {
          score += 50;
          stars.splice(i, 1);
        }

        if (
          star.y >
          canvas.height + 30
        ) {
          stars.splice(i, 1);
        }
      }

      score++;
      scoreText.textContent =
        Math.floor(score / 10);

      requestAnimationFrame(update);
    }

    function gameOver() {
      running = false;

      const finalScore =
        Math.floor(score / 10);

      if (finalScore > best) {
        best = finalScore;
        bestText.textContent = best;
      }

      ctx.fillStyle =
        "rgba(0,0,0,0.65)";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      ctx.fillStyle = "white";
      ctx.font = "40px Arial";
      ctx.textAlign = "center";

      ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2
      );

      startBtn.textContent =
        "Play Again";
    }

    function startGame() {
      meteors = [];
      stars = [];

      score = 0;

      player.x =
        canvas.width / 2 -
        player.width / 2;

      running = true;

      startBtn.textContent =
        "Restart";

      update();
    }

    setInterval(() => {
      if (running) {
        createMeteor();
      }
    }, 700);

    setInterval(() => {
      if (running) {
        createStar();
      }
    }, 3000);

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key === "ArrowLeft"
        ) {
          leftPressed = true;
        }

        if (
          event.key === "ArrowRight"
        ) {
          rightPressed = true;
        }
      }
    );

    document.addEventListener(
      "keyup",
      event => {
        if (
          event.key === "ArrowLeft"
        ) {
          leftPressed = false;
        }

        if (
          event.key === "ArrowRight"
        ) {
          rightPressed = false;
        }
      }
    );

    const leftBtn =
      document.getElementById("leftBtn");

    const rightBtn =
      document.getElementById("rightBtn");

    leftBtn.addEventListener(
      "mousedown",
      () => leftPressed = true
    );

    leftBtn.addEventListener(
      "mouseup",
      () => leftPressed = false
    );

    rightBtn.addEventListener(
      "mousedown",
      () => rightPressed = true
    );

    rightBtn.addEventListener(
      "mouseup",
      () => rightPressed = false
    );

    leftBtn.addEventListener(
      "touchstart",
      () => leftPressed = true
    );

    leftBtn.addEventListener(
      "touchend",
      () => leftPressed = false
    );

    rightBtn.addEventListener(
      "touchstart",
      () => rightPressed = true
    );

    rightBtn.addEventListener(
      "touchend",
      () => rightPressed = false
    );

    startBtn.addEventListener(
      "click",
      startGame
    );
  </script>
</body>
</html>
