<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Day Cards</title>
  <!-- This script loads Tailwind CSS so the classes work -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 font-sans">

  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Weekly Dashboard</h1>

    <!-- 
      THIS IS THE CONTAINER TO EDIT FOR PART B. 
      Try changing these grid classes and resizing your browser! 
    -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- Card 1 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Monday</h2>
        <p class="text-gray-600 text-sm">AP Physics & Math Review</p>
      </div>

      <!-- Card 2 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Tuesday</h2>
        <p class="text-gray-600 text-sm">Basketball Drills & Scrimmage</p>
      </div>

      <!-- Card 3 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Wednesday</h2>
        <p class="text-gray-600 text-sm">Drafting Humanities Essay</p>
      </div>

      <!-- Card 4 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Thursday</h2>
        <p class="text-gray-600 text-sm">OpenCV & Python coding</p>
      </div>

      <!-- Card 5 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Friday</h2>
        <p class="text-gray-600 text-sm">Logic Pro Beat Making</p>
      </div>

      <!-- Card 6 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Saturday</h2>
        <p class="text-gray-600 text-sm">Golf at the range</p>
      </div>

      <!-- Card 7 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
        <h2 class="text-lg font-bold text-blue-600 mb-2">Sunday</h2>
        <p class="text-gray-600 text-sm">Rest and recover</p>
      </div>

    </div>
  </div>

</body>
</html>
