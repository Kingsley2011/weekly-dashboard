<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Sandbox</title>
  <!-- This script tag loads the Tailwind CSS engine on the fly -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">
  <!-- Main Wrapper -->
  <div id="card-wrapper" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm shadow-2xl">
    <!-- Profile Image -->
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Profile" class="w-24 h-24 rounded-full mx-auto border-4 border-emerald-500 shadow-lg object-cover">
    <!-- User Information -->
    <h2 class="text-2xl font-bold text-white text-center mt-4">Alex Mercer</h2>
    <p class="text-sm font-semibold text-emerald-400 text-center uppercase tracking-wider mb-4">Senior UI Designer</p>
    <p class="text-slate-400 text-center text-sm leading-relaxed mb-6">
    </p>
    <!-- Action Target -->
    <a href="#" class="block text-center bg-emerald-500 text-slate-950 font-bold py-3 px-6 rounded-2xl shadow-lg transition-all duration-300 ease-in-out hover:bg-emerald-400 hover:scale-[1.03] hover:shadow-emerald-500/20">View Portfolio</a>
  </div>
</body>
</html>
